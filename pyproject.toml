[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-qq-ocr"
version = "0.1.0"
description = "IMWatchingU desktop monitor and QQ notifier"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.10,<6.11", "Pillow>=12,<13", "numpy>=2,<3",
  "httpx>=0.28,<0.29", "websockets>=15,<16", "mss>=10,<11", "qrcode>=8,<9",
  "windows-capture>=1.5,<2; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "pytest-asyncio>=1,<2", "ruff>=0.12", "pyinstaller>=6,<7"]

[project.gui-scripts]
imwatchingu = "screen_qq_ocr.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screen_qq_ocr = ["ui/theme/*.qss", "ui/theme/icons/*/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
